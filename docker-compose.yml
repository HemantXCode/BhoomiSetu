version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bhoomisetu_db
    restart: always
    environment:
      POSTGRES_DB: bhoomisetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/001_demo_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomisetu_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/bhoomisetu
      SECRET_KEY: bhoomisetu_production_jwt_secret_key_2026
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomisetu_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
